name: Build Android APK

on:
  workflow_dispatch:   # Manual trigger from GitHub website
  push:
    branches: [main]

jobs:
  build:
    name: Build APK with EAS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build Android APK (preview)
        run: eas build --platform android --profile preview --non-interactive --wait

      - name: Download latest APK
        run: |
          # Get the latest build URL and download
          BUILD_URL=$(eas build:list --platform android --limit 1 --json --non-interactive | jq -r '.[0].artifacts.buildUrl // empty')
          if [ -n "$BUILD_URL" ]; then
            curl -L -o ebo-stay.apk "$BUILD_URL"
            echo "APK downloaded successfully"
          else
            echo "Could not get build URL. Check Expo dashboard."
          fi

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ebo-stay-apk
          path: ebo-stay.apk
          retention-days: 30
          if-no-files-found: ignore
